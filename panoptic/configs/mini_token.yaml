# ─── Mini Token Training Config (Phase 5) ────────────────────────────────────
# Warm-start from best.pth, train token head + fine-tune decoder on mini

# ── Data ──
data:
  dataroot: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/nuscenes_mini
  version: v1.0-mini
  voxel_size: 0.05
  point_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

# ── Augmentation ──
augmentation:
  enabled: true
  random_rotate_z: true
  random_flip_x: true
  random_flip_y: true
  random_scale_min: 0.95
  random_scale_max: 1.05
  random_translate_std: 0.1

# ── Model ──
model:
  backbone_ckpt: models/nuscenes_openseg.pth.tar
  backbone_dim: 768
  hidden_dim: 256
  num_classes: 16
  num_thing_queries: 100
  num_stuff_classes: 6
  nheads: 8
  dim_feedforward: 1024
  num_blocks: 3
  num_levels: 3
  dropout: 0.0
  use_token_head: true
  token_dim: 768

# ── Loss ──
loss:
  focal_gamma: 4.0
  focal_alpha: 0.25
  eos_coef: 0.1
  weight_ce: 2.0
  weight_mask: 5.0
  weight_dice: 5.0
  cost_class: 2.0
  cost_mask: 5.0
  cost_dice: 5.0
  num_points: 50000
  num_mask_pts: 500
  p_ratio: 0.75

# ── Token head loss ──
token:
  weight: 0.5
  warmup_steps: 100
  prototype_path: panoptic/clip_prototypes/text_prototypes_vitl14_336.pt

# ── Training ──
training:
  epochs: 10
  lr: 5.0e-5
  weight_decay: 0.01
  grad_clip: 0.5
  grad_accum: 4
  batch_size: 1
  num_workers: 0
  seed: 42

  scheduler: cosine_warmup
  warmup_epochs: 1
  min_lr: 1.0e-6
  cosine_T_max: 10
  cosine_eta_min: 1.0e-6
  step_size: 8
  step_gamma: 0.1

  mixed_precision: true

# ── Warm start ──
warm_start:
  checkpoint: panoptic/checkpoints/best.pth
  strict: false

# ── Logging ──
logging:
  log_every: 10
  eval_every: 1
  wandb_project: openscene-panoptic
  wandb_entity: null
  wandb_enabled: true
  wandb_run_name: mini-token-v1

# ── Checkpointing ──
checkpoint:
  save_dir: panoptic/checkpoints_token
  save_every: 1
  resume: null
  auto_resume: true

# ── Inference ──
inference:
  overlap_thr: 0.8
  min_points: 50
