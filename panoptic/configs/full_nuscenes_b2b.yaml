# ─── Phase 5a: B2b Class-Agnostic Training Config ─────────────────────────────
# Based on full_nuscenes.yaml. Key changes:
#   - weight_ce=0.0 → disables classification loss (zero gradient)
#   - cost_class=0.0 → matcher uses geometry-only matching (BCE + Dice)
#   - warm_start from Phase 4 best checkpoint (PQ=0.473)
#   - Inference via backbone feature pooling to 22 CLIP text prototypes

# ── Data ──
data:
  dataroot: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/nuscenes
  version: v1.0-trainval
  voxel_size: 0.05
  point_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

# ── Augmentation (training only) ──
augmentation:
  enabled: true
  random_rotate_z: true
  random_flip_x: true
  random_flip_y: true
  random_scale_min: 0.95
  random_scale_max: 1.05
  random_translate_std: 0.1

# ── Model ──
model:
  backbone_ckpt: models/nuscenes_openseg.pth.tar
  backbone_dim: 768
  hidden_dim: 256
  num_classes: 16          # kept for architecture compat (class_embed still exists)
  num_thing_queries: 100
  num_stuff_classes: 6
  nheads: 8
  dim_feedforward: 1024
  num_blocks: 3
  num_levels: 3
  dropout: 0.0
  use_token_head: false

# ── Loss ──
loss:
  focal_gamma: 4.0
  focal_alpha: 0.25
  eos_coef: 0.1
  weight_ce: 0.0            # DISABLED — class-agnostic training
  weight_mask: 5.0
  weight_dice: 5.0
  cost_class: 0.0           # DISABLED — geometry-only matching
  cost_mask: 5.0
  cost_dice: 5.0
  num_points: 50000
  num_mask_pts: 500
  p_ratio: 0.75

# ── Training ──
training:
  epochs: 20
  lr: 5.0e-5
  weight_decay: 0.01
  grad_clip: 0.5
  grad_accum: 8
  batch_size: 1
  num_workers: 4
  seed: 42

  scheduler: cosine_warmup
  warmup_epochs: 2
  min_lr: 1.0e-6
  cosine_T_max: 20
  cosine_eta_min: 1.0e-6
  step_size: 25
  step_gamma: 0.1

  mixed_precision: true

# ── Warm Start ──
warm_start:
  checkpoint: panoptic/checkpoints_full/best.pth   # Phase 4 PQ=0.473
  strict: true

# ── Open-Vocab Inference ──
open_vocab:
  prototypes_path: panoptic/embeddings/text_prototypes_22.pt
  objectness_thr: 0.3
  min_mask_pts: 10
  num_known_classes: 16
  num_total_classes: 22
  novel_class_names:
    - pole
    - bench
    - trash can
    - fire hydrant
    - tree trunk
    - curb

# ── Logging ──
logging:
  log_every: 50
  eval_every: 2
  wandb_project: openscene-panoptic
  wandb_entity: null
  wandb_enabled: true
  wandb_run_name: full-nuscenes-b2b-class-agnostic

# ── Checkpointing ──
checkpoint:
  save_dir: panoptic/checkpoints_b2b
  save_every: 2
  resume: null
  auto_resume: true

# ── Inference ──
inference:
  overlap_thr: 0.8
  min_points: 50
