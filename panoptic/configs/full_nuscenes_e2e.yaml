# ─── E2E Encoder Unfreezing — Full nuScenes ─────────────────────────────────
# Run AFTER mini validation confirms improvement.
# Warm-starts from full nuScenes frozen-backbone best.pth

# ── Data ──
data:
  dataroot: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/nuscenes
  version: v1.0-trainval
  voxel_size: 0.05
  point_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

# ── Augmentation ──
augmentation:
  enabled: true
  random_rotate_z: true
  random_flip_x: true
  random_flip_y: true
  random_scale_min: 0.95
  random_scale_max: 1.05
  random_translate_std: 0.1

# ── Model ──
model:
  backbone_ckpt: models/nuscenes_openseg.pth.tar
  backbone_dim: 768
  hidden_dim: 256
  num_classes: 16
  num_thing_queries: 100
  num_stuff_classes: 6
  nheads: 8
  dim_feedforward: 1024
  num_blocks: 3
  num_levels: 3
  dropout: 0.0

# ── E2E Config ──
e2e:
  enabled: true
  unfreeze_mode: decoder_only
  unfreeze_last_n: 2
  backbone_lr: 1.0e-6
  unfreeze_after_epoch: 10
  warmstart_ckpt: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/openscene/panoptic/checkpoints_token_full_v2/best.pth

# ── Loss ──
loss:
  focal_gamma: 4.0
  focal_alpha: 0.25
  eos_coef: 0.1
  weight_ce: 2.0
  weight_mask: 5.0
  weight_dice: 5.0
  cost_class: 2.0
  cost_mask: 5.0
  cost_dice: 5.0
  num_points: 50000
  num_mask_pts: 500
  p_ratio: 0.75

# ── Training ──
training:
  epochs: 30
  lr: 5.0e-5
  weight_decay: 0.01
  grad_clip: 0.5
  grad_accum: 8
  batch_size: 1
  num_workers: 4
  seed: 42
  scheduler: cosine_warmup
  warmup_epochs: 3
  min_lr: 1.0e-6
  mixed_precision: true

# ── Logging ──
logging:
  log_every: 50
  eval_every: 3
  wandb_project: openscene-panoptic-e2e
  wandb_entity: null
  wandb_enabled: true
  wandb_run_name: full_e2e_decoder_only

# ── Checkpointing ──
checkpoint:
  save_dir: panoptic/checkpoints_e2e_full
  save_every: 3
  resume: null
  auto_resume: true

# ── Inference ──
inference:
  overlap_thr: 0.8
  min_points: 50

open_vocab:
  token_dim: 768
  token_mlp_layers: 3

  objectness_mode: ternary
  region_pool_mode: weighted_mean

  clip_score_weight: 0.7
  objectness_weight: 0.3

  # leave default unless you specifically changed novel classes
  novel_class_idx: [1, 5, 8, 10]