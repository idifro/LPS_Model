# Job 1c mini: smoke test on v1.0-mini (3 epochs)
# Same architecture as job1c.yaml — validates loss wiring before full run

data:
  dataroot: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/nuscenes_mini
  version: v1.0-mini
  voxel_size: 0.05

model:
  backbone_ckpt: models/nuscenes_openseg.pth.tar
  backbone_dim: 768
  hidden_dim: 256
  num_classes: 16
  num_thing_queries: 100
  num_stuff_classes: 6
  nheads: 8
  dim_feedforward: 1024
  num_blocks: 3
  num_levels: 3
  dropout: 0.0
  clip_embed_dim: 768
  head_type: single_clip

lora:
  enabled: true
  rank: 16
  dropout: 0.05

warm_start:
  checkpoint: panoptic/checkpoints_job1b_v2_lo_novel_pq/best.pth

loss:
  cost_class: 0.0
  cost_mask: 5.0
  cost_dice: 5.0
  eos_coef: 0.1
  weight_ce: 0.0
  weight_mask: 5.0
  weight_dice: 5.0
  weight_obj: 2.0
  p_ratio: 0.75

token:
  prototype_path: panoptic/clip_prototypes/text_prototypes_vitl14_224_v2.pt
  negative_bank: panoptic/clip_prototypes/negative_bank_v2.pt
  multiprompt_path: panoptic/clip_prototypes/text_prototypes_vitl14_224_multiprompt_v2.pt
  learnable_temperature: true
  temp_max: 5.0
  margin: 0.1
  weight: 1.0
  restore_from_warm_start: true

distillation:
  enabled: true
  clip_feat_dir: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/clip_features_v2
  L_O:
    weight: 1.0
    warmup_epochs: 1
    loss_type: cosine
  L_V:
    weight: 0.3
    warmup_epochs: 1
    mode: broadcast
    margin_gate_threshold: -0.01

voxel_decomp:
  enabled: true
  weight: 0.5
  warmup_epochs: 3
  temperature: 0.07
  n_sample: 8192

training:
  lr_decoder: 2.0e-5
  lr_token_head: 3.0e-5
  lr_lora: 5.0e-5
  weight_decay: 0.01
  epochs: 20
  warmup_epochs: 1
  min_lr: 5.0e-7
  mixed_precision: true
  grad_accum: 8
  grad_clip: 0.5
  num_workers: 0
  phase1_epochs: 1

logging:
  log_every: 10
  eval_every: 1
  wandb_enabled: false
  wandb_project: openscene-panoptic
  wandb_run_name: job1c-mini

checkpoint:
  save_dir: panoptic/checkpoints_job1c_mini
  save_every: 1
