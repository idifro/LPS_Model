# ─── Full nuScenes Token Training v2 (Phase 5, proper warm-start) ─────────────
# Changes from v1:
#   - Warm-start from full PQ=0.473 checkpoint (not mini)
#   - Contrastive (InfoNCE) token loss with learnable temperature
#   - Aux token loss on all 9 intermediate decoder layers
#   - Differential LR: decoder=1e-5, token_head=5e-5
#   - Token weight 1.0 (was 0.5)

# ── Data ──
data:
  dataroot: /fs/scratch/SX_ETL3_GenAI_Team/mha2cob/nuscenes
  version: v1.0-trainval
  voxel_size: 0.05
  point_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

# ── Augmentation ──
augmentation:
  enabled: true
  random_rotate_z: true
  random_flip_x: true
  random_flip_y: true
  random_scale_min: 0.95
  random_scale_max: 1.05
  random_translate_std: 0.1

# ── Model ──
model:
  backbone_ckpt: models/nuscenes_openseg.pth.tar
  backbone_dim: 768
  hidden_dim: 256
  num_classes: 16
  num_thing_queries: 100
  num_stuff_classes: 6
  nheads: 8
  dim_feedforward: 1024
  num_blocks: 3
  num_levels: 3
  dropout: 0.0
  use_token_head: true
  token_dim: 768

# ── Loss ──
loss:
  focal_gamma: 4.0
  focal_alpha: 0.25
  eos_coef: 0.1
  weight_ce: 2.0
  weight_mask: 5.0
  weight_dice: 5.0
  cost_class: 2.0
  cost_mask: 5.0
  cost_dice: 5.0
  num_points: 50000
  num_mask_pts: 500
  p_ratio: 0.75

# ── Token head loss ──
token:
  weight: 1.0              # v2: aggressive (was 0.5)
  warmup_steps: 500
  prototype_path: panoptic/clip_prototypes/text_prototypes_vitl14_336.pt
  loss_type: contrastive    # v2: InfoNCE (was cosine)
  temperature: 0.07         # initial temperature (1/tau)
  learnable_temperature: true  # CLIP-style learnable log-temperature
  aux_token_loss: true      # v2: apply token loss to all 9 aux decoder layers

# ── Training ──
training:
  epochs: 20
  lr: 1.0e-5               # v2: lower base LR for pretrained decoder (was 5e-5)
  token_head_lr: 5.0e-5    # v2: NEW — higher LR for fresh token head
  weight_decay: 0.01
  grad_clip: 0.5
  grad_accum: 8
  batch_size: 1
  num_workers: 4
  seed: 42

  scheduler: cosine_warmup
  warmup_epochs: 2
  min_lr: 1.0e-6
  cosine_T_max: 20
  cosine_eta_min: 1.0e-6
  step_size: 15
  step_gamma: 0.1

  mixed_precision: true

# ── Warm start ──
warm_start:
  checkpoint: panoptic/checkpoints_full/best.pth   # v2: full checkpoint (PQ=0.473)
  strict: false

# ── Logging ──
logging:
  log_every: 50
  eval_every: 2
  wandb_project: openscene-panoptic
  wandb_entity: null
  wandb_enabled: true
  wandb_run_name: full-nuscenes-token-v2

# ── Checkpointing ──
checkpoint:
  save_dir: panoptic/checkpoints_token_full_v2     # v2: separate checkpoint dir
  save_every: 2
  resume: null
  auto_resume: true

# ── Inference ──
inference:
  overlap_thr: 0.8
  min_points: 50

# ── Open-Vocabulary (Strategy E) ──
# Optional: novel classes for geometric ensemble evaluation.
# If omitted, defaults to: ["police car", "ambulance", "trash cans", "pole", "bench"]
# novel_classes: ["police car", "ambulance", "trash cans", "pole", "bench"]
