DATA:
  data_root: data/nuscenes_3d
  data_root_2d_fused_feature: data/nuscenes_multiview_openseg
  feature_2d_extractor: openseg
  classes: 16
  aug: False
  voxel_size: 0.05
  input_color: False
  use_shm: False

DISTILL:
  arch_3d: MinkUNet18A
  ignore_label: 255
  train_gpu: [0, 1, 2, 3]           # 4x A100; CUDA_VISIBLE_DEVICES set from this list
  workers: 4                         # divided by ngpus_per_node inside distill.py -> 1/GPU
  batch_size: 4                      # TOTAL across all GPUs; divided per-GPU -> 1/GPU
  batch_size_val: 1
  base_lr: 0.0001
  loss_type: cosine
  loop: 5
  epochs: 5
  start_epoch: 0
  power: 0.9
  momentum: 0.9
  manual_seed: 3407
  print_freq: 1
  save_freq: 1
  save_path: exp/nusc_full_openseg
  resume:                            # set to model_last.pth.tar to resume
  evaluate: True
  eval_freq: 1

TEST:
  split: val
  prompt_eng: True
  mark_no_feature_to_unknown: True
  feature_type: distill
  save_feature_as_numpy: False
  map_nuscenes_details: True
  vis_input: False
  vis_pred: False
  vis_gt: False
  test_workers: 0
  test_gpu: [0]
  test_batch_size: 1
  test_repeats: 1
  model_path:
  save_folder: exp/nusc_full_openseg/eval

Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: nccl
  multiprocessing_distributed: True  # enables mp.spawn across 4 GPUs
  world_size: 1                      # multiplied by ngpus_per_node -> 4 total
  rank: 0
